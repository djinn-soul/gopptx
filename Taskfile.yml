version: '3'

vars:
  GO_BRIDGE_SRC: ./bindings/c
  PYTHON_PKG_DIR: python/gopptx
  GO_ALLOWED_LICENSES: MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,MPL-2.0,ISC
  LIB_NAME:
    sh: |
      case "$(go env GOOS)" in
        darwin) echo "libgopptx.dylib" ;;
        windows) echo "gopptx.dll" ;;
        *) echo "libgopptx.so" ;;
      esac

tasks:
  default:
    desc: Build and test everything
    deps: [test]

  build:go:
    desc: Build Go bridge for Python
    sources:
      - 'bindings/c/**/*.go'
      - 'pkg/**/*.go'
      - 'internal/**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.PYTHON_PKG_DIR}}/{{.LIB_NAME}}'
    cmds:
      - |
        if [ "${GOPPTX_RELEASE_BUILD}" = "1" ] || [ "${GOPPTX_RELEASE_BUILD}" = "true" ]; then
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o {{.PYTHON_PKG_DIR}}/{{.LIB_NAME}} -buildmode=c-shared {{.GO_BRIDGE_SRC}}
        else
          go build -o {{.PYTHON_PKG_DIR}}/{{.LIB_NAME}} -buildmode=c-shared {{.GO_BRIDGE_SRC}}
        fi

  setup:python:
    desc: Setup Python environment using uv
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/pyvenv.cfg
    cmds:
      - uv sync --extra dev --frozen --python 3.12

  test:go:
    desc: Run Go unit tests
    cmds:
      - go test ./bindings/... ./cmd/... ./internal/... ./pkg/...

  test:python:
    desc: Run Python tests
    deps: [setup:python]
    cmds:
      - task build:go
      - uv run --frozen pytest python/tests

  test:python-smoke:
    desc: Verify the Python package imports successfully
    deps: [setup:python]
    cmds:
      - task build:go
      - uv run --frozen python -c "import gopptx; print('Python package imported successfully')"

  test:
    desc: Run all tests
    deps: [test:go, test:python]

  lint:
    desc: Run all linters
    cmds:
      - golangci-lint run ./...
      - uv run ruff check python/gopptx python/tests scripts/ci hatch_build.py
      - uv run basedpyright
      - task check:generated
      - task check:versions
      - task check:go-licenses

  generate:
    desc: Regenerate all code generated from Go declarations
    cmds:
      - go generate ./...

  check:generated:
    desc: Fail when generated files are stale relative to their Go sources
    cmds:
      # Compares the working tree before and after regenerating, so it reports
      # only files that `go generate` itself changed. Any generator wired up
      # with //go:generate is covered without listing its outputs here.
      # `git diff` is part of the snapshot so that a content change to a file
      # that was already modified is caught, not just newly appearing files.
      - |
        before="$(git status --porcelain; git diff)"
        go generate ./...
        after="$(git status --porcelain; git diff)"
        if [ "$before" != "$after" ]; then
          echo "Generated files are stale. Run 'task generate' and commit the result." >&2
          echo "Working tree after regenerating:" >&2
          echo "$after" >&2
          exit 1
        fi

  check:versions:
    desc: Verify Go and Python development versions match
    cmds:
      - uv run python scripts/ci/check_version_consistency.py

  check:go-licenses:
    desc: Validate licenses for direct Go dependencies
    cmds:
      - go run github.com/google/go-licenses/v2@latest check ./... --allowed_licenses={{.GO_ALLOWED_LICENSES}}

  docs:serve:
    desc: Serve MkDocs Material docs on http://localhost:8000 (Docker)
    cmds:
      - docker run --rm -it -p 8000:8000 -v "{{.USER_WORKING_DIR}}:/docs" squidfunk/mkdocs-material:9.7.5 serve -a 0.0.0.0:8000

  docs:build:
    desc: Build MkDocs Material docs strictly (Docker)
    cmds:
      - docker run --rm -v "{{.USER_WORKING_DIR}}:/docs" squidfunk/mkdocs-material:9.7.5 build --strict
