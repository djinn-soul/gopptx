# Organized Pre-commit Configuration
# Run `uv run prek auto-update` periodically to update hook versions
#
# Priority tiers:
#   prek runs hooks in ascending priority and treats one priority as a parallel
#   group. Hooks that rewrite files therefore get a tier of their own, in the
#   order their output feeds the next one; read-only checks share a tier.
#
#   Tier 0      read-only structural checks
#   Tiers 1-5   whitespace/JSON fixers - they rewrite the same files
#   Tiers 6-7   ruff format, then ruff check --fix
#   Tier 8      uv-lock, which the exports below read
#   Tier 9      the two uv-export runs, writing different files
#   Tier 10     go mod tidy, before anything reads go.mod
#   Tier 11     every slow read-only check, in parallel
#   Tier 12     pip-audit last and alone: its editable install runs
#               `go build -buildmode=c-shared` and rewrites
#               python/gopptx/gopptx.h, so it is a mutator despite the name.

default_stages: [commit]

repos:
  # --- Standard Hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Tier 0: these only read, so they all run together.
      - id: check-yaml
        priority: 0
      - id: check-json
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-added-large-files
        priority: 0
      - id: detect-private-key
        priority: 0
      - id: debug-statements
        priority: 0
      # Tiers 1-5: each rewrites files the next one also rewrites.
      - id: mixed-line-ending
        args: ["--fix=lf"]
        priority: 1
      - id: end-of-file-fixer
        priority: 2
      - id: trailing-whitespace
        priority: 3
      - id: pretty-format-json
        args: [--autofix, --indent=4, --no-sort-keys]
        priority: 4
      - id: requirements-txt-fixer
        priority: 5

  # --- Ruff (tiers 6-7 - modifies files) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-format
        name: ruff-format (commit)
        files: ^(python/gopptx|python/tests|scripts/ci|hatch_build\.py)
        # Generated files: the generators own their formatting and their noqa
        # comments, and --ignore-noqa would otherwise strip them back out on
        # every run, leaving the tree permanently drifted from `task generate`.
        exclude: ^python/gopptx/(_ops_constants|presentation/charts/chart_types)\.py$
        priority: 6
      - id: ruff
        name: ruff check --fix (commit)
        args:
          ["--fix", "--ignore-noqa", "--unsafe-fixes", "--exit-non-zero-on-fix"]
        files: ^(python/gopptx|python/tests|scripts/ci|hatch_build\.py)
        # Generated files: the generators own their formatting and their noqa
        # comments, and --ignore-noqa would otherwise strip them back out on
        # every run, leaving the tree permanently drifted from `task generate`.
        exclude: ^python/gopptx/(_ops_constants|presentation/charts/chart_types)\.py$
        priority: 7

  # --- Codespell (tier 11 - read-only) ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          [
            # propertie/descripton are deliberate misspellings: the strict-kwargs
            # tests pass them to assert the API rejects unknown keywords. "Hel" is
            # a "Hello" fixture split across runs by the text-replace tests.
            # Beng/te are ISO 15924 script codes and BCP-47 language subtags in the
            # lang-to-script tables; fPr is the OOXML <m:fPr> fraction-properties tag.
            "--ignore-words-list=nd,ot,tt,astroid,prSet,pres,lIns,fromT,userA,ser,initialY,currentY,defaultY,wantIn,effectiveness,flate,propertie,descripton,Hel,Beng,te,fPr",
            "--skip=./.venv,./uv.lock,./.git,./internal/pptxxml/templates/smartart",
          ]
        # The SmartArt templates are captured from PowerPoint: the identifiers in
        # them are Microsoft's ("DropPin"), not prose of ours to correct. The
        # --skip above misses them because the paths handed to the hook carry no
        # leading "./", so the exclusion is stated here as well.
        exclude: ^(uv\.lock|internal/pptxxml/templates/smartart/.*)$
        priority: 11

  # --- Dependency Management (tiers 8-9 - after formatters) ---
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.26
    hooks:
      - id: uv-lock
        priority: 8
      - id: uv-export
        name: Export requirements.txt
        args:
          ["--output-file", "requirements.txt", "--no-hashes", "--frozen", "--python", "3.10"]
        always_run: true
        priority: 9
      - id: uv-export
        name: Export requirements-dev.txt
        args:
          ["--extra", "dev", "--output-file", "requirements-dev.txt", "--no-hashes", "--frozen", "--python", "3.10"]
        always_run: true
        priority: 9

  # ==========================================================================
  # Local Hooks
  # ==========================================================================
  - repo: local
    hooks:
      # --- Tier 10: go mod tidy, alone, because it rewrites go.mod/go.sum ---
      - id: go-mod-tidy
        name: go mod tidy
        entry: go
        language: system
        files: (\.go$|^go\.mod$|^go\.sum$)
        pass_filenames: false
        args: ["mod", "tidy"]
        priority: 10

      # --- Tier 11: slow read-only checks, all in parallel ---
      - id: basedpyright
        name: basedpyright strict type-check (push)
        entry: uv run basedpyright --level error
        language: system
        types: [python]
        pass_filenames: false
        stages: [commit, push]
        priority: 11

      - id: architectural-guardrails
        name: architectural guardrails (LOC + import cycles)
        entry: uv run python scripts/ci/architectural_guardrails.py
        language: system
        pass_filenames: false
        stages: [commit, push]
        priority: 11

      - id: version-consistency
        name: Go/Python version consistency
        entry: uv run python scripts/ci/check_version_consistency.py
        language: system
        pass_filenames: false
        stages: [commit, push]
        priority: 11

      - id: bandit
        name: bandit security scan
        entry: uv run bandit -r python/gopptx -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
        priority: 11

      - id: vulture
        name: vulture dead code detection
        entry: uv run vulture python/gopptx vulture_whitelist.py vulture_whitelist_review.py --min-confidence 60
        language: system
        types: [python]
        pass_filenames: false
        priority: 11

      - id: go-vet
        name: go vet
        entry: go
        language: system
        files: (\.go$|^go\.mod$|^go\.sum$)
        pass_filenames: false
        args:
          ["vet", "./cmd/...", "./internal/...", "./pkg/...", "./examples/..."]
        priority: 11

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint
        language: system
        files: (\.go$|^go\.mod$|^go\.sum$)
        pass_filenames: false
        args:
          [
            "run",
            "--config",
            ".golangci.yml",
            "./cmd/...",
            "./internal/...",
            "./pkg/...",
            "./examples/...",
          ]
        priority: 11

      # --- Tier 12: pip-audit last and alone; it rewrites gopptx.h ---
      - id: pip-audit
        name: pip-audit dependency scan
        entry: uv run python scripts/ci/pip_audit_check.py
        language: system
        pass_filenames: false
        args:
          [
            "--requirements",
            "requirements-dev.txt",
            "--ignore-file",
            "pip-audit-ignore.txt",
          ]
        priority: 12
